<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="A simple offline to-do tasks app." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>MyTasks</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MY PRODUCTIVITY</p>
        <h1>MyTasks</h1>
        <p id="dateText" class="date"></p>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">☾</button>
    </header>

    <section class="stats" aria-label="Task statistics">
      <div><strong id="totalCount">0</strong><span>Total</span></div>
      <div><strong id="activeCount">0</strong><span>Pending</span></div>
      <div><strong id="doneCount">0</strong><span>Done</span></div>
    </section>

    <section class="composer">
      <input id="taskInput" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" />
      <button id="addBtn" class="primary">Add</button>
    </section>

    <nav class="filters" aria-label="Task filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Pending</button>
      <button class="filter" data-filter="done">Done</button>
    </nav>

    <section id="taskList" class="task-list" aria-live="polite"></section>

    <section id="emptyState" class="empty hidden">
      <div class="empty-icon">✓</div>
      <h2 id="emptyTitle">No tasks yet</h2>
      <p id="emptyText">Add your first task above and start getting things done.</p>
    </section>

    <footer>
      <button id="clearDone" class="text-btn">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
